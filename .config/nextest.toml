# Fork-only nextest settings (camiloavelar/herdr).
#
# The remote bridge tests drive a 300ms idle deadline with real sleeps, so a
# stalled CI runner can expire the bridge between steps and fail with
# BrokenPipe. Retry them instead of letting runner load fail the build; a
# real regression still fails every attempt.
[[profile.default.overrides]]
filter = 'test(/^platform::remote_bridge_tests::/)'
retries = 2

# The server binds its API socket before it installs the SIGTERM handler, and
# this test signals as soon as that socket appears. Under parallel load the
# signal can land in that window and kill the server before it logs why.
[[profile.default.overrides]]
filter = 'test(=server_survives_hangup_and_logs_why_it_stops)'
retries = 2
