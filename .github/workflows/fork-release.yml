name: Fork Release

# Fork-only release pipeline for camiloavelar/herdr.
#
# - Every push to master builds Linux and macOS preview binaries and publishes
#   them on the rolling `preview` prerelease together with `preview.json`, so a
#   client on `herdr channel set preview` picks up each master build.
# - A `v*` tag builds stable binaries and publishes a GitHub release with
#   `latest.json`, which `herdr update` on the stable channel reads from
#   this repository's latest release.

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  plan:
    if: github.repository == 'camiloavelar/herdr'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      build_id: ${{ steps.plan.outputs.build_id }}
      commit: ${{ steps.plan.outputs.commit }}
      built_at: ${{ steps.plan.outputs.built_at }}
      base_version: ${{ steps.plan.outputs.base_version }}
      protocol: ${{ steps.plan.outputs.protocol }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Plan build
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          protocol="$(python3 -c 'import re; print(re.search(r"pub const PROTOCOL_VERSION: u32 = (\d+);", open("src/protocol/wire.rs").read()).group(1))')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            channel=stable
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$base_version" != "$tag_version" ]; then
              echo "error: tag $GITHUB_REF_NAME doesn't match Cargo.toml version $base_version"
              exit 1
            fi
          else
            channel=preview
          fi
          short_sha="$(git rev-parse --short=12 HEAD)"
          day="$(git show -s --format=%cs HEAD)"
          {
            echo "channel=$channel"
            echo "build_id=$day-$short_sha"
            echo "commit=$GITHUB_SHA"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "base_version=$base_version"
            echo "protocol=$protocol"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: github.repository == 'camiloavelar/herdr'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: herdr-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: herdr-macos-aarch64

    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
      HERDR_BUILD_CHANNEL: ${{ needs.plan.outputs.channel }}
      HERDR_BUILD_COMMIT: ${{ needs.plan.outputs.commit }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set preview build id
        if: needs.plan.outputs.channel == 'preview'
        shell: bash
        run: echo "HERDR_BUILD_ID=${{ needs.plan.outputs.build_id }}" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Prefer official Ubuntu mirrors over Azure
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: fork-release-${{ matrix.target }}

      - name: Remove Zig caches
        shell: bash
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: cp target/${{ matrix.target }}/release/herdr ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: [plan, build]
    if: github.repository == 'camiloavelar/herdr' && needs.plan.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: Generate update manifest
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          PROTOCOL: ${{ needs.plan.outputs.protocol }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("v")
          repo = os.environ["REPOSITORY"]
          upstream = json.loads(pathlib.Path("distribution/latest.json").read_text())
          names = ["herdr-linux-x86_64", "herdr-linux-aarch64", "herdr-macos-x86_64", "herdr-macos-aarch64"]
          assets, sha256 = {}, {}
          for name in names:
              key = name.removeprefix("herdr-")
              data = pathlib.Path(name, name).read_bytes()
              assets[key] = f"https://github.com/{repo}/releases/download/{tag}/{name}"
              sha256[key] = hashlib.sha256(data).hexdigest()
          manifest = {
              "version": version,
              "protocol": int(os.environ["PROTOCOL"]),
              "endpoint_generation": upstream.get("endpoint_generation", 1),
              "notes": f"Fork build {tag} of {repo}. See the release page for details.",
              "assets": assets,
              "sha256": sha256,
              "announcement": None,
              "releases": {},
          }
          pathlib.Path("latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(pathlib.Path("latest.json").read_text())
          PY

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: |
            herdr-linux-x86_64/herdr-linux-x86_64
            herdr-linux-aarch64/herdr-linux-aarch64
            herdr-macos-x86_64/herdr-macos-x86_64
            herdr-macos-aarch64/herdr-macos-aarch64
            latest.json
          body: Fork build ${{ github.ref_name }} of ${{ github.repository }}.

  preview-release:
    needs: [plan, build]
    if: github.repository == 'camiloavelar/herdr' && needs.plan.outputs.channel == 'preview'
    runs-on: ubuntu-latest
    concurrency:
      group: fork-preview-release
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: Generate preview manifest
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          BUILD_ID: ${{ needs.plan.outputs.build_id }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          BUILT_AT: ${{ needs.plan.outputs.built_at }}
          BASE_VERSION: ${{ needs.plan.outputs.base_version }}
          PROTOCOL: ${{ needs.plan.outputs.protocol }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          env = os.environ
          repo = env["REPOSITORY"]
          upstream = json.loads(pathlib.Path("distribution/latest.json").read_text())
          names = ["herdr-linux-x86_64", "herdr-linux-aarch64", "herdr-macos-x86_64", "herdr-macos-aarch64"]
          assets = {}
          for name in names:
              key = name.removeprefix("herdr-")
              data = pathlib.Path(name, name).read_bytes()
              assets[key] = {
                  "url": f"https://github.com/{repo}/releases/download/preview/{name}",
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          build = {
              "base_version": env["BASE_VERSION"],
              "commit": env["COMMIT"],
              "built_at": env["BUILT_AT"],
              "protocol": int(env["PROTOCOL"]),
              "endpoint_generation": upstream.get("endpoint_generation", 1),
              "assets": assets,
          }
          manifest = {
              "schema_version": 1,
              "channel": "preview",
              "build_id": env["BUILD_ID"],
              **build,
              "notes": f"Fork preview build {env['BUILD_ID']} of {repo} at commit {env['COMMIT']}.",
              "builds": {env["BUILD_ID"]: build},
          }
          pathlib.Path("preview.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(pathlib.Path("preview.json").read_text())
          PY

      - name: Move rolling preview tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPOSITORY/git/refs/tags/preview" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPOSITORY/git/refs/tags/preview" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$REPOSITORY/git/refs" -f ref=refs/tags/preview -f sha="$GITHUB_SHA" >/dev/null
          fi

      - name: Publish rolling preview release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: preview
          name: Preview ${{ needs.plan.outputs.build_id }}
          prerelease: true
          files: |
            herdr-linux-x86_64/herdr-linux-x86_64
            herdr-linux-aarch64/herdr-linux-aarch64
            herdr-macos-x86_64/herdr-macos-x86_64
            herdr-macos-aarch64/herdr-macos-aarch64
            preview.json
          body: |
            Rolling preview build of ${{ github.repository }} master.
            Build ${{ needs.plan.outputs.build_id }} at commit ${{ needs.plan.outputs.commit }}.
